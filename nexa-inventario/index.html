<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nexa Sport · Inventario</title>
<style>
  /* Grilla de tarjetas oscura, la misma de la vista vieja de Nexa; arriba resumen por categoría. */
  :root{
    --bg:#0b0d12; --card:#151922; --line:#222836;
    --txt:#f2f4f8; --muted:#9aa2b3; --accent:#00e08a; --pill:#1d2330;
    --ok-bg:rgba(0,224,138,.12); --low:#ffc107; --low-bg:rgba(255,193,7,.13);
    --ph:#0e1119; --noimg:#4a5262; --photo-bg:#ffffff; --tag-bg:rgba(11,13,18,.78);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-block:14px 40px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700;letter-spacing:.3px;margin:0}
  header h1 span{color:var(--accent)}
  .fecha{font-size:12px;color:var(--muted)}
  .excel{margin-left:auto;background:var(--accent);color:#07120c;border:0;border-radius:10px;
    padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .excel:focus-visible,.chip:focus-visible,.search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .excel[disabled]{opacity:.5;cursor:default}
  .aviso{font-size:12.5px;color:var(--muted);min-height:16px}
  .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .tot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tot b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .tot small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:12px 14px;border-radius:12px;font-size:15px;outline:none;font-family:inherit}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{background:var(--pill);border:1px solid var(--line);color:var(--muted);padding:7px 13px;
    border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);color:#07120c;border-color:var(--accent);font-weight:600}
  h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 0;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;min-width:0}
  .ph{aspect-ratio:1/1;max-width:100%;background:var(--ph);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph.of{background:var(--photo-bg)}
  .ph.of img{object-fit:contain}
  .ph{position:relative}
  .propia{position:absolute;left:6px;bottom:6px;font-size:10.5px;background:var(--tag-bg);color:var(--txt);
    padding:2px 7px;border-radius:6px}
  .noimg{color:var(--noimg);font-size:34px}
  .body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .brand{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .name{font-size:13.5px;font-weight:600;line-height:1.25}
  .color{font-size:12px;color:var(--muted)}
  .row{margin-top:auto;padding-top:6px;display:flex;justify-content:flex-end}
  .stock{font-size:12px;padding:3px 9px;border-radius:8px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .s-ok{background:var(--ok-bg);color:var(--accent)}
  .s-low{background:var(--low-bg);color:var(--low)}
  .talles{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .talle{font-size:12px;background:var(--pill);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-variant-numeric:tabular-nums}
  .talle b{color:var(--accent)}
  .state{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;grid-column:1/-1}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px}
</style>
</head>

<div class="wrap">
  <header>
    <h1>NEXA <span>SPORT</span> · Inventario</h1>

  <div class="aviso" id="aviso" role="status"></div>

  <input class="search" id="search" placeholder="Buscar modelo, marca, color o número…" autocomplete="off">
  <div class="filters" id="cats"></div>
  <div class="filters" id="marcas"></div>
  <div id="lista"></div>
  <footer>Solo lectura · para cambiar algo, pedíselo a José</footer>
</div>

const CATS = ["Palas","Paleteros","Calzado","Accesorios"];
let cat = "Todo", marca = "TODAS", term = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const unid = (n, cat) => cat==="Calzado" ? (n===1?"1 par":n+" pares") : cat==="Accesorios" ? (n===1?"1 blíster":n+" blísteres") : (n===1?"1 unidad":n+" unidades");
const total = c => ITEMS.filter(i=>!c||i.cat===c).reduce((s,i)=>s+i.cant,0);

function resumen(){
  $("resumen").innerHTML = CATS.map(c =>
    `<div class="tot"><small>${c}</small><b>${total(c)}</b></div>`).join("");
}
function filtros(){
  $("cats").innerHTML = ["Todo",...CATS].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}" type="button">${c}</button>`).join("");
  const ms = ["TODAS",...[...new Set(ITEMS.filter(i=>cat==="Todo"||i.cat===cat).map(i=>i.marca.toUpperCase()))].sort()];
  if(!ms.includes(marca)) marca="TODAS";
  $("marcas").innerHTML = ms.map(m=>`<button class="chip ${m===marca?"on":""}" data-m="${esc(m)}" type="button">${esc(m)}</button>`).join("");
  $("cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;filtros();pintar();});
  $("marcas").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{marca=b.dataset.m;filtros();pintar();});
}
function foto(k, of){
  const img = FOTOS[k] ? `<img src="${FOTOS[k]}" alt="" loading="lazy">` : `<div class="noimg">${k==="zapa"?"👟":"🎾"}</div>`;
  return `<div class="ph${of?" of":""}">${img}${FOTOS[k]&&!of?'<span class="propia">foto del local</span>':""}</div>`;
}
function pasa(i){
  const okC = cat==="Todo" || i.cat===cat;
  const okM = marca==="TODAS" || i.marca.toUpperCase()===marca;
  const okT = !term || norm([i.marca,i.modelo,i.color,i.num].join(" ")).includes(term);
  return okC && okM && okT;
}
function tarjeta(i){
  const st = i.cant<=2 ? "s-low" : "s-ok";
  return `<div class="card">${foto(i.foto, i.of)}<div class="body">
    <div class="brand">${esc(i.marca)}</div><div class="name">${esc(i.modelo)}</div>
    ${i.color?`<div class="color">${esc(i.color)}</div>`:""}
    <div class="row"><span class="stock ${st}">${unid(i.cant,i.cat)}</span></div></div></div>`;
}
function tarjetaZapa(g){
  const n = g.items.reduce((s,i)=>s+i.cant,0);
  return `<div class="card">${foto(g.items[0].foto, g.items[0].of)}<div class="body">
    <div class="brand">${esc(g.marca)}</div><div class="name">${esc(g.modelo)}</div>
    <div class="color">${esc(g.color)}</div>
    <div class="talles">${g.items.sort((a,b)=>a.num-b.num).map(i=>`<span class="talle">N° ${i.num} · <b>${i.cant}</b></span>`).join("")}</div>
    <div class="row"><span class="stock ${n<=2?"s-low":"s-ok"}">${unid(n,"Calzado")}</span></div></div></div>`;
}
function pintar(){
  const vis = ITEMS.filter(pasa);
  if(!vis.length){ $("lista").innerHTML = '<div class="state">Nada coincide con lo que buscaste.</div>'; return; }
  $("lista").innerHTML = CATS.map(c=>{
    const de = vis.filter(i=>i.cat===c); if(!de.length) return "";
    let cards;
    if(c==="Calzado"){
      const g = {}; de.forEach(i=>{ const k=i.marca+"|"+i.modelo+"|"+i.color; (g[k]=g[k]||{marca:i.marca,modelo:i.modelo,color:i.color,items:[]}).items.push(i); });
      cards = Object.values(g).map(tarjetaZapa).join("");
    } else cards = de.map(tarjeta).join("");
    return `<h2>${c} · ${de.reduce((s,i)=>s+i.cant,0)}</h2><div class="grid">${cards}</div>`;
  }).join("");
}
$("search").addEventListener("input", e=>{ term = norm(e.target.value.trim()); pintar(); });

/* Excel: una hoja con todo y otra con el calzado por número. */
let downloads = null;
async function descargar(){
  const btn = $("btnExcel"), aviso = $("aviso");
  if(typeof XLSX==="undefined"){ aviso.textContent = "No cargó la herramienta de Excel. Recargá la página."; return; }
  const filas = ITEMS.map(i=>({ "Categoría":i.cat, "Marca":i.marca, "Modelo":i.modelo, "Color":i.color||"", "Número":i.num||"", "Cantidad":i.cant }));
  const libro = XLSX.utils.book_new();
  const h1 = XLSX.utils.json_to_sheet(filas); h1["!cols"]=[{wch:12},{wch:16},{wch:46},{wch:26},{wch:9},{wch:10}];
  XLSX.utils.book_append_sheet(libro, h1, "Inventario");
  const zap = ITEMS.filter(i=>i.cat==="Calzado").sort((a,b)=>(a.modelo+a.color).localeCompare(b.modelo+b.color)||a.num-b.num)
    .map(i=>({ "Modelo":i.modelo, "Color":i.color, "Número":i.num, "Pares":i.cant }));
  const h2 = XLSX.utils.json_to_sheet(zap); h2["!cols"]=[{wch:36},{wch:26},{wch:9},{wch:8}];
  XLSX.utils.book_append_sheet(libro, h2, "Calzado por número");
  const res = CATS.map(c=>({ "Categoría":c, "Total":total(c) }));
  XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(res), "Resumen");
  const buf = XLSX.write(libro, { bookType:"xlsx", type:"array" });
  btn.disabled = true; aviso.textContent = "";
  try{ XLSX.writeFile(libro, "inventario-nexa-2026-10-19.xlsx"); aviso.textContent = "Excel descargado."; }
  catch(e){ aviso.textContent = "No se pudo descargar el Excel."; }
  finally{ btn.disabled = false; }
}
$("btnExcel").onclick = descargar;

resumen(); filtros(); pintar();
